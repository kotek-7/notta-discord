[package]
name = "notta-discord"
version = "0.1.0"
edition = "2024"
description = "Mix microphone and desktop audio into a virtual microphone for Notta"
license = "MIT"

[dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive"] }
ctrlc = { version = "3", features = ["termination"] }
fs2 = "0.4"
serde_json = "1"
